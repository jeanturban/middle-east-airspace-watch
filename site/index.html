<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Middle East Airspace Watch</title>
<style>
  :root {
    --surface: #f7f6f2; --surface-2: #ffffff; --water: #ffffff; --land: #e8e4d8;
    --border: #d6d3c9; --text: #1f1f1c; --text-2: #4a4944; --text-3: #75736b;
    --blue: #2f6fc4; --red: #c94343; --base: #9c9a90; --on: #e6e3d9; --panel: rgba(255,255,255,.93);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; }
  header { padding: 12px 16px 6px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .meta { color: var(--text-3); font-size: 12px; }
  .demo { background: #fbe3b4; color: #6b4300; padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 12px; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 6px 16px 8px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
  .seg button { background: none; border: 0; color: var(--text-2); padding: 4px 10px; border-radius: 4px; cursor: pointer; font: inherit; }
  .seg button.on { background: var(--on); color: var(--text); font-weight: 600; }
  .seg button:focus-visible, .btn:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .btn, select { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
  .lbl { color: var(--text-3); font-size: 12px; }
  .ctl { display: inline-flex; gap: 6px; align-items: center; }
  input[type=range] { accent-color: var(--blue); width: 90px; }
  .stat { color: var(--text-2); font-size: 12px; margin-left: auto; text-align: right; flex: 1 1 200px; min-width: 0; }
  .stat b { color: var(--text); font-weight: 600; }
  #mapwrap { position: relative; overflow: hidden; min-height: 300px; }
  #mapwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #gl, #top { pointer-events: none; }
  #base { cursor: grab; touch-action: none; }
  #base.drag { cursor: grabbing; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; color: var(--text); display: none; white-space: nowrap; z-index: 3; }
  #tip .s { color: var(--text-3); }
  #legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 11px; color: var(--text-2); z-index: 2; max-width: 260px; }
  #legend canvas { position: static; display: block; width: 220px; height: 10px; border-radius: 2px; margin: 4px 0 2px; }
  #legend .ticks { display: flex; justify-content: space-between; color: var(--text-3); }
  .lineKey { display: flex; gap: 12px; margin-top: 4px; }
  .lineKey span { display: inline-flex; align-items: center; gap: 5px; }
  .lineKey { flex-wrap: wrap; align-items: center; }
  .lineKey i { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--blue); }
  .lineKey i.gap { border-top: 1px solid rgba(120,119,112,.7); }
  .lineKey i.hatch { flex: none; height: 12px; border: 0; background: repeating-linear-gradient(-45deg, rgba(110,104,90,.5) 0 1.2px, transparent 1.2px 4.2px); }
  #zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
  #zoom .btn { width: 30px; padding: 4px 0; }
  #loading { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--text-2); z-index: 2; display: none; }
  #note { position: absolute; right: 12px; bottom: 12px; max-width: 300px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 11px; color: var(--text-3); z-index: 2; }
  #note b { color: var(--text-2); font-weight: 600; }
  #noteX { float: right; background: none; border: 0; color: var(--text-3); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 0 0 6px; }
  footer { border-top: 1px solid var(--border); padding: 6px 16px 10px; }
  .tlhead { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--text-2); margin-bottom: 2px; flex-wrap: wrap; }
  .key { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  #timeline { width: 100%; height: 86px; display: block; user-select: none; cursor: crosshair; touch-action: none; }
  .hide { display: none !important; }
  #frame { position: absolute; left: 12px; top: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 12px; font-size: 20px; font-weight: 600; color: var(--text); z-index: 2; font-variant-numeric: tabular-nums; }
  #frame small { display: block; font-size: 11px; font-weight: 400; color: var(--text-3); }
  @media (max-width: 700px) { #note { display: none; } .stat { margin-left: 0; text-align: left; width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Middle East Airspace Watch</h1>
  <span class="meta" id="source">Loading…</span>
  <span class="demo hide" id="demo">SYNTHETIC DEMO DATA, not real flights</span>
</header>

<div class="bar">
  <div class="seg" id="mode" role="tablist">
    <button data-v="lines" class="on" role="tab">Flight paths</button>
    <button data-v="density" role="tab">Heatmap</button>
    <button data-v="compare" role="tab">Compare periods</button>
  </div>
  <span class="lbl" id="presetLbl">Range</span>
  <div class="seg" id="presets">
    <button data-v="1">1 day</button><button data-v="7">7 days</button><button data-v="30">30 days</button><button data-v="90">All</button>
  </div>
  <div class="seg hide" id="editing">
    <button data-v="base">Edit baseline</button><button data-v="cmp" class="on">Edit recent</button>
  </div>
  <span class="ctl" id="airportCtl"><span class="lbl">Flights</span><select id="airport"><option value="0">All flights</option></select></span>
  <span class="ctl" id="brightCtl"><span class="lbl">Line width</span><input type="range" id="bright" min="-2" max="2" step="0.1" value="0" aria-label="Line width"></span>
  <label class="ctl" id="gapCtl" title="Stretches where no receiver heard the aircraft for over 5 minutes are drawn as a straight join between the last and next report. Tick to show them in grey."><input type="checkbox" id="gaps"><span class="lbl">Mark unheard stretches</span></label>
  <button class="btn" id="play" title="Animate week by week through the whole period">▶ Play weekly</button>
  <div class="stat" id="stat"></div>
</div>

<div id="mapwrap">
  <canvas id="base" aria-label="Map of flights over the Middle East"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="top"></canvas>
  <div id="tip"></div>
  <div id="loading">Loading flights…</div>
  <div id="frame" class="hide"></div>
  <div id="zoom"><button class="btn" id="zin" aria-label="Zoom in">+</button><button class="btn" id="zout" aria-label="Zoom out">−</button><button class="btn" id="zreset" aria-label="Reset view">⟲</button></div>
  <div id="legend"></div>
  <div id="note"><button id="noteX" aria-label="Close note">×</button><b>Reading this map.</b> <span id="noteTxt"></span></div>
</div>

<footer>
  <div class="tlhead">
    <span>Flights per day crossing the region. Drag to choose dates.</span>
    <span class="key" id="kSel"><span class="sw" style="background:var(--blue)"></span><span id="kSelTxt">Selected</span></span>
    <span class="key hide" id="kBase"><span class="sw" style="background:var(--base)"></span>Baseline</span>
    <span class="key hide" id="kEvt"><span style="color:var(--text)">◆</span>Event</span>
    <span id="rangeTxt" style="margin-left:auto;color:var(--text)"></span>
  </div>
  <svg id="timeline"></svg>
</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
const MAX_LINES = 150000;            // above this, a random sample of flights is drawn
const PLAY_MAX_LINES = 30000;        // ...and this while the animation plays (about half of each week)
const FRAME_MS = 1500;               // time per week in the animation
const S = { mode: "lines", sel: [0, 0], base: [0, 0], editing: "cmp", cache: new Map(), lineCache: new Map(),
            zoom: 1, panX: 0, panY: 0, playing: null, field: null, airport: 0, bright: 0, gaps: false, lines: null };
let G, M, BM, EV = [];
const NOTES = {
  lines: "Each line is one civil flight that crossed the region (Egypt to Pakistan, Yemen to the Caucasus), drawn from takeoff to landing. Lines fade out with distance from Doha (or the airport picked under <i>Flights</i>), from about 1,800 km. Where no receiver heard the aircraft for over 5 minutes, the line is a straight join between the last and next report (tick <i>Mark unheard stretches</i> to show these in grey). <b>Hatched areas</b> (e.g. Saudi Arabia, Iraq, Iran, the Arabian Sea) have few or no receivers: flights crossing them are drawn as straight joins between the last and next report (exact path unknown), slightly thinner than heard traffic. Compare hatched areas over time rather than with unhatched ones. Empty areas can mean airlines avoid them <i>or</i> that no receivers cover them.",
  density: "Each ~28 km cell counts the flights that crossed it per day, averaged over the selected dates and smoothed slightly. Unheard stretches count too, along the straight join between the last and next report, so in <b>hatched areas</b> (few or no receivers) the traffic is real but its exact position is approximate. Pick an airport under <i>Flights</i> to see only its flights.",
  compare: "Red cells lost traffic compared with the baseline, blue cells gained it. A cell that goes from busy to empty is a real change; an area that was always empty may just lack receivers."
};

// ---------- data ----------
async function getJSON(p) { const r = await fetch(p); if (!r.ok) throw new Error(p + " " + r.status); return r.json(); }
async function loadDay(date) {
  if (S.cache.has(date)) return S.cache.get(date);
  const p = getJSON(`data/days/${date}.json`).then(d => {
    const a = new Float32Array(G.w * G.h); let idx = 0; const c = d.cells;
    for (let i = 0; i < c.length; i += 2) { idx += c[i]; a[idx] = c[i + 1]; }
    return a;
  }).catch(() => null);
  S.cache.set(date, p); return p;
}
async function average([i0, i1]) {
  const arrs = await Promise.all(M.days.slice(i0, i1 + 1).map(d => loadDay(d.date)));
  const out = new Float32Array(G.w * G.h); let n = 0;
  for (const a of arrs) { if (!a) continue; n++; for (let i = 0; i < out.length; i++) out[i] += a[i]; }
  if (n) for (let i = 0; i < out.length; i++) out[i] /= n;
  return out;
}
// one line shard: see pipeline/process_day.py for the layout
function parseShard(buf) {
  const u32 = new Uint32Array(buf, 0, 4), nl = u32[1], np = u32[2], al = n => (n + 3) & ~3;
  let o = 16; const lens = new Uint16Array(buf, o, nl); o += al(2 * nl);
  const od = new Uint8Array(buf, o, 2 * nl); o += al(2 * nl);
  const pts = new Int16Array(buf, o, 2 * np); o += al(4 * np);
  const gap = new Uint8Array(buf, o, np);
  return { nl, np, lens, orig: od.subarray(0, nl), dest: od.subarray(nl), pts, gap };
}
let bundle = null; // some hosts can't serve .bin files: manifest.bundle points to one JSON of base64 shards instead
function fetchShard(date, k) {
  if (!M.bundle) return fetch(`data/lines/${date}.s${k}.bin`).then(r => r.ok ? r.arrayBuffer() : null);
  bundle = bundle || getJSON("data/" + M.bundle);
  return bundle.then(b => { const s = b[`${date}.s${k}.bin`]; if (!s) return null;
    const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; });
}
function loadShard(date, k) {
  const key = date + "/" + k;
  if (!S.lineCache.has(key)) S.lineCache.set(key, fetchShard(date, k)
    .then(b => b && b.byteLength >= 16 ? parseShard(b) : null).catch(() => null));
  return S.lineCache.get(key);
}
// which shards to load for a range: all 4 per day up to MAX_LINES flights (PLAY_MAX_LINES while playing),
// fewer per day above that (each shard is a random quarter of the day)
function shardPlan([i0, i1], max) {
  const days = M.days.slice(i0, i1 + 1).filter(d => d.shards), total = days.reduce((s, d) => s + d.legs, 0);
  const per = Math.max(1, Math.min(4, Math.ceil(4 * max / Math.max(1, total))));
  return { days, total, per, list: days.flatMap(d => Array.from({ length: Math.min(per, d.shards) }, (_, k) => [d.date, k])) };
}
async function loadLines(range) {
  const { days, total, per, list } = shardPlan(range, S.playing ? PLAY_MAX_LINES : MAX_LINES);
  const shards = await Promise.all(list.map(([d, k]) => loadShard(d, k)));
  let nl = 0, np = 0; for (const s of shards) if (s) { nl += s.nl; np += s.np; }
  const pts = new Int16Array(2 * np), gap = new Uint8Array(np), start = new Uint32Array(nl), len = new Uint16Array(nl),
        orig = new Uint8Array(nl), dest = new Uint8Array(nl);
  let li = 0, pi = 0;
  for (const s of shards) { if (!s) continue;
    pts.set(s.pts, 2 * pi); gap.set(s.gap, pi); orig.set(s.orig, li); dest.set(s.dest, li); len.set(s.lens, li);
    for (let j = 0; j < s.nl; j++) { start[li + j] = pi; pi += s.lens[j]; }
    li += s.nl; }
  return { nl, np, pts, gap, start, len, orig, dest, total, days: days.length, sampled: per < 4 && nl < total };
}

// Receiver coverage on a COV_RES° grid over the analysis box, from the loaded lines: the share of drawn
// distance in each cell that was actually heard (observed) rather than an unheard straight join.
// low[] = 0 (well covered) .. 1 (little or no coverage); hatch[] = low, but only where flights pass.
const COV_RES = 0.5;
const COV_OBS = [0.15, 0.45];   // observed share: at or below the first = no coverage, at or above the second = covered
const COV_KM_DAY = [20, 120];   // km of flight path per day in a cell (all flights): hatch fades in over this range
function coverage(L) {
  const cw = Math.round((G.lon_max - G.lon_min) / COV_RES), ch = Math.round((G.lat_max - G.lat_min) / COV_RES);
  const obs = new Float64Array(cw * ch), join = new Float64Array(cw * ch), P = L.pts, STEP = 0.25;
  for (let j = 0; j < L.nl; j++) {
    const s = L.start[j];
    for (let p = s + 1; p < s + L.len[j]; p++) {
      const f = L.gap[p]; if (f > 1) continue;
      const la0 = P[2 * p - 2] / 100, lo0 = P[2 * p - 1] / 100, la1 = P[2 * p] / 100, lo1 = P[2 * p + 1] / 100;
      if (Math.max(la0, la1) < G.lat_min || Math.min(la0, la1) > G.lat_max ||
          Math.max(lo0, lo1) < G.lon_min || Math.min(lo0, lo1) > G.lon_max) continue;
      const dla = la1 - la0, dlo = lo1 - lo0, n = Math.max(1, Math.ceil(Math.max(Math.abs(dla), Math.abs(dlo)) / STEP));
      const km = 111.2 * Math.hypot(dla, dlo * Math.cos((la0 + la1) * Math.PI / 360)) / n, a = f ? join : obs;
      for (let i = 0; i < n; i++) {
        const t = (i + 0.5) / n, x = Math.floor((lo0 + dlo * t - G.lon_min) / COV_RES), y = Math.floor((la0 + dla * t - G.lat_min) / COV_RES);
        if (x >= 0 && y >= 0 && x < cw && y < ch) a[y * cw + x] += km;
      }
    }
  }
  // 3x3 smoothing so neither the line weights nor the hatching follow the grid's blocks
  const blur = a => { const o = new Float64Array(a.length);
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) { let v = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const X = x + dx, Y = y + dy;
        if (X >= 0 && Y >= 0 && X < cw && Y < ch) { v += a[Y * cw + X]; n++; } }
      o[y * cw + x] = v / n; }
    return o; };
  const O = blur(obs), J = blur(join), perDay = 1 / Math.max(1, L.days) / (L.sampled ? L.nl / L.total : 1);
  const sm = (e0, e1, x) => { const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
  const low = new Uint8Array(cw * ch), hatch = new Uint8Array(cw * ch);
  for (let i = 0; i < low.length; i++) {
    const tot = O[i] + J[i], l = tot > 0 ? 1 - sm(COV_OBS[0], COV_OBS[1], O[i] / tot) : 0;
    low[i] = Math.round(255 * l); hatch[i] = Math.round(255 * l * sm(COV_KM_DAY[0], COV_KM_DAY[1], tot * perDay));
  }
  return { cw, ch, low, hatch };
}

// Heatmap: flights per day crossing each HEAT_RES° cell, from the loaded lines (unheard joins included,
// so areas without receivers aren't blank), each flight counted once per cell, then lightly smoothed.
// Rows run north -> south like the canvas. Honours the airport filter.
const HEAT_RES = 0.25;
function heatField(L) {
  const w = Math.round((G.lon_max - G.lon_min) / HEAT_RES), h = Math.round((G.lat_max - G.lat_min) / HEAT_RES);
  let a = new Float32Array(w * h); const stamp = new Int32Array(w * h).fill(-1), P = L.pts, STEP = 0.1, ap = S.airport;
  for (let j = 0; j < L.nl; j++) {
    if (ap && L.orig[j] !== ap && L.dest[j] !== ap) continue;
    const s = L.start[j];
    for (let p = s + 1; p < s + L.len[j]; p++) {
      if (L.gap[p] > 1) continue;
      const la0 = P[2 * p - 2] / 100, lo0 = P[2 * p - 1] / 100, la1 = P[2 * p] / 100, lo1 = P[2 * p + 1] / 100;
      if (Math.max(la0, la1) < G.lat_min || Math.min(la0, la1) > G.lat_max ||
          Math.max(lo0, lo1) < G.lon_min || Math.min(lo0, lo1) > G.lon_max) continue;
      const dla = la1 - la0, dlo = lo1 - lo0, n = Math.max(1, Math.ceil(Math.max(Math.abs(dla), Math.abs(dlo)) / STEP));
      for (let i = 0; i <= n; i++) {
        const x = Math.floor((lo0 + dlo * i / n - G.lon_min) / HEAT_RES), y = Math.floor((G.lat_max - la0 - dla * i / n) / HEAT_RES);
        if (x < 0 || y < 0 || x >= w || y >= h) continue;
        const k = y * w + x; if (stamp[k] !== j) { stamp[k] = j; a[k]++; }
      }
    }
  }
  const perDay = 1 / Math.max(1, L.days) / (L.sampled ? L.nl / L.total : 1);
  for (let i = 0; i < a.length; i++) a[i] *= perDay;
  // two 1-2-1 passes each way: a small Gaussian-like blur (keeps totals, softens the straight joins)
  for (let pass = 0; pass < 2; pass++) for (const [dx, dy] of [[1, 0], [0, 1]]) {
    const o = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const X0 = Math.max(0, x - dx), Y0 = Math.max(0, y - dy), X1 = Math.min(w - 1, x + dx), Y1 = Math.min(h - 1, y + dy);
      o[y * w + x] = (a[Y0 * w + X0] + 2 * a[y * w + x] + a[Y1 * w + X1]) / 4; }
    a = o; }
  return { a, w, h, res: HEAT_RES };
}

// ---------- colour ----------
const SEQ = [[214,229,247],[160,197,238],[98,152,222],[50,108,190],[22,68,140],[9,37,88]];   // light -> dark blue (light map)
function lerpRamp(r, t) { t = Math.max(0, Math.min(1, t)) * (r.length - 1); const i = Math.min(r.length - 2, Math.floor(t)), f = t - i;
  return r[i].map((v, k) => v + (r[i + 1][k] - v) * f); }
const RED = [201,67,67], BLUE = [47,111,196], MID = [205,202,193];
function divColor(t) { const c = t < 0 ? RED : BLUE, f = Math.min(1, Math.abs(t)); return MID.map((v, k) => v + (c[k] - v) * f); }
function quantile(arr, q) { const v = []; for (const x of arr) if (x > 0) v.push(x); if (!v.length) return 1;
  v.sort((a, b) => a - b); return v[Math.min(v.length - 1, Math.floor(q * v.length))]; }

const off = document.createElement("canvas");
async function buildField() {
  if (S.mode === "density") {
    const H = heatField(S.lines), f = H.a; off.width = H.w; off.height = H.h;
    const octx = off.getContext("2d"), img = octx.createImageData(H.w, H.h), px = img.data, E = 6;
    // while the animation plays, keep the first week's colour scale so weeks are comparable
    const vmax = S.playing && S.playing.vmax || Math.max(1, quantile(f, 0.995)), L = Math.log1p(vmax);
    if (S.playing) S.playing.vmax = vmax;
    for (let y = 0; y < H.h; y++) for (let x = 0; x < H.w; x++) { const i = y * H.w + x; if (f[i] < 0.05) continue;
      const t = Math.min(1, Math.log1p(f[i]) / L), c = lerpRamp(SEQ, t);
      const edge = Math.min(1, (Math.min(x, y, H.w - 1 - x, H.h - 1 - y) + 0.5) / E);   // no hard box edge
      px.set([c[0], c[1], c[2], Math.round(255 * Math.min(1, 0.15 + t) * edge * Math.min(1, f[i]))], i * 4); }
    octx.putImageData(img, 0, 0);
    S.field = H; S.vmax = vmax; return;
  }
  off.width = G.w; off.height = G.h;
  const octx = off.getContext("2d"), img = octx.createImageData(G.w, G.h), px = img.data;
  {
    const [a, b] = await Promise.all([average(S.base), average(S.sel)]);

// ---------- boot ----------
(async () => {
  try {
    [M, BM] = await Promise.all([getJSON("data/manifest.json"), getJSON("data/basemap.json")]);
    try { EV = (await getJSON("data/events.json")).events || []; } catch (e) { EV = []; }
  } catch (e) { $("source").textContent = "Could not load data: " + e.message; return; }
  G = M.grid; const n = M.days.length;
  if (!n) { $("source").textContent = "No data yet: the first pipeline run has not finished."; return; }
  M.airports = M.airports || [];
  const hasLines = M.days.some(d => d.shards);
  if (!hasLines || !gl) {  // older data without paths, or no WebGL2: fall back to the heatmap
    S.mode = "density"; [...$("mode").children].forEach(b => b.classList.toggle("on", b.dataset.v === "density"));
    if (!hasLines) $("mode").children[0].classList.add("hide");
    $("airportCtl").classList.add("hide"); $("brightCtl").classList.add("hide"); $("gapCtl").classList.add("hide");
  }
  const opts = M.airports.slice(0, 40).map((a, i) => [a[0], i + 1]).sort();
  for (const [code, i] of opts) { const o = document.createElement("option"); o.value = i; o.textContent = `To/from ${code}`; $("airport").appendChild(o); }
  $("demo").classList.toggle("hide", !M.demo);
  $("kEvt").classList.toggle("hide", !EV.length);
  $("noteTxt").innerHTML = NOTES[S.mode];
  $("source").textContent = `${M.demo ? "" : M.source + " · "}${n} days · last day ${fmtD(M.days[n - 1].date)} · updated ${M.generated.slice(0, 10)}`;
  S.sel = [Math.max(0, n - 7), n - 1]; S.base = [0, Math.min(n - 1, 29)]; preset(7);
  timeline(); await refresh();
  new ResizeObserver(() => { timeline(); draw(); }).observe($("mapwrap"));
})();
</script>
</body>
</html>
