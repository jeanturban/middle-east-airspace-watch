<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Middle East Airspace Watch</title>
<style>
  :root {
    --surface: #1a1a19; --surface-2: #232321; --water: #121211; --land: #24241f;
    --border: #3a3a36; --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
    --blue: #3987e5; --red: #e66767; --base: #a9a89f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; }
  header { padding: 12px 16px 6px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .meta { color: var(--text-3); font-size: 12px; }
  .demo { background: #5a3d10; color: #ffd89a; padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 12px; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 6px 16px 8px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
  .seg button { background: none; border: 0; color: var(--text-2); padding: 4px 10px; border-radius: 4px; cursor: pointer; font: inherit; }
  .seg button.on { background: #3a3a36; color: var(--text); }
  .seg button:focus-visible, .btn:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .btn, select { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
  .lbl { color: var(--text-3); font-size: 12px; }
  .ctl { display: inline-flex; gap: 6px; align-items: center; }
  input[type=range] { accent-color: var(--blue); width: 90px; }
  .stat { color: var(--text-2); font-size: 12px; margin-left: auto; text-align: right; flex: 1 1 200px; min-width: 0; }
  .stat b { color: var(--text); font-weight: 600; }
  #mapwrap { position: relative; overflow: hidden; min-height: 300px; }
  #mapwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #gl, #top { pointer-events: none; }
  #base { cursor: grab; touch-action: none; }
  #base.drag { cursor: grabbing; }
  #tip { position: absolute; pointer-events: none; background: rgba(26,26,25,.94); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; color: var(--text); display: none; white-space: nowrap; z-index: 3; }
  #tip .s { color: var(--text-3); }
  #legend { position: absolute; left: 12px; bottom: 12px; background: rgba(26,26,25,.88); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 11px; color: var(--text-2); z-index: 2; max-width: 260px; }
  #legend canvas { position: static; display: block; width: 220px; height: 10px; border-radius: 2px; margin: 4px 0 2px; }
  #legend .ticks { display: flex; justify-content: space-between; color: var(--text-3); }
  .lineKey { display: flex; gap: 12px; margin-top: 4px; }
  .lineKey span { display: inline-flex; align-items: center; gap: 5px; }
  .lineKey { flex-wrap: wrap; align-items: center; }
  .lineKey i { display: inline-block; width: 22px; height: 0; border-top: 2px solid #3c8ae8; }
  .lineKey i.gap { border-top: 1px solid rgba(158,158,148,.6); }
  #zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
  #zoom .btn { width: 30px; padding: 4px 0; }
  #loading { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(26,26,25,.9);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--text-2); z-index: 2; display: none; }
  #note { position: absolute; right: 12px; bottom: 12px; max-width: 300px; background: rgba(26,26,25,.88); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 11px; color: var(--text-3); z-index: 2; }
  #note b { color: var(--text-2); font-weight: 600; }
  #noteX { float: right; background: none; border: 0; color: var(--text-3); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 0 0 6px; }
  footer { border-top: 1px solid var(--border); padding: 6px 16px 10px; }
  .tlhead { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--text-2); margin-bottom: 2px; flex-wrap: wrap; }
  .key { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  #timeline { width: 100%; height: 86px; display: block; user-select: none; cursor: crosshair; touch-action: none; }
  .hide { display: none !important; }
  @media (max-width: 700px) { #note { display: none; } .stat { margin-left: 0; text-align: left; width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Middle East Airspace Watch</h1>
  <span class="meta" id="source">Loading…</span>
  <span class="demo hide" id="demo">SYNTHETIC DEMO DATA, not real flights</span>
</header>

<div class="bar">
  <div class="seg" id="mode" role="tablist">
    <button data-v="lines" class="on" role="tab">Flight paths</button>
    <button data-v="density" role="tab">Heatmap</button>
    <button data-v="compare" role="tab">Compare periods</button>
  </div>
  <span class="lbl" id="presetLbl">Range</span>
  <div class="seg" id="presets">
    <button data-v="1">1 day</button><button data-v="7">7 days</button><button data-v="30">30 days</button><button data-v="90">All</button>
  </div>
  <div class="seg hide" id="editing">
    <button data-v="base">Edit baseline</button><button data-v="cmp" class="on">Edit recent</button>
  </div>
  <span class="ctl" id="airportCtl"><span class="lbl">Flights</span><select id="airport"><option value="0">All flights</option></select></span>
  <span class="ctl" id="brightCtl"><span class="lbl">Line width</span><input type="range" id="bright" min="-2" max="2" step="0.1" value="0" aria-label="Line width"></span>
  <label class="ctl" id="gapCtl" title="Stretches where no receiver heard the aircraft for over 5 minutes, joined with a straight line"><input type="checkbox" id="gaps"><span class="lbl">Show gaps</span></label>
  <button class="btn" id="play" title="Slide a 7-day window across the whole period">▶ Play weekly</button>
  <div class="stat" id="stat"></div>
</div>

<div id="mapwrap">
  <canvas id="base" aria-label="Map of flights over the Middle East"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="top"></canvas>
  <div id="tip"></div>
  <div id="loading">Loading flights…</div>
  <div id="zoom"><button class="btn" id="zin" aria-label="Zoom in">+</button><button class="btn" id="zout" aria-label="Zoom out">−</button><button class="btn" id="zreset" aria-label="Reset view">⟲</button></div>
  <div id="legend"></div>
  <div id="note"><button id="noteX" aria-label="Close note">×</button><b>Reading this map.</b> <span id="noteTxt"></span></div>
</div>

<footer>
  <div class="tlhead">
    <span>Flights per day crossing the region. Drag to choose dates.</span>
    <span class="key" id="kSel"><span class="sw" style="background:var(--blue)"></span><span id="kSelTxt">Selected</span></span>
    <span class="key hide" id="kBase"><span class="sw" style="background:var(--base)"></span>Baseline</span>
    <span class="key hide" id="kEvt"><span style="color:var(--text)">◆</span>Event</span>
    <span id="rangeTxt" style="margin-left:auto;color:var(--text)"></span>
  </div>
  <svg id="timeline"></svg>
</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
const MAX_LINES = 150000;            // above this, a random sample of flights is drawn
const S = { mode: "lines", sel: [0, 0], base: [0, 0], editing: "cmp", cache: new Map(), lineCache: new Map(),
            zoom: 1, panX: 0, panY: 0, playing: null, field: null, airport: 0, bright: 0, gaps: false, lines: null };
let G, M, BM, EV = [];
const NOTES = {
  lines: "Each line is one civil flight that crossed the dashed box, drawn from takeoff to landing wherever volunteer receivers heard it. Where no position was received for over 5 minutes the line stops (turn on <i>Show gaps</i> to see those stretches as straight joins). Empty areas can mean airlines avoid them <i>or</i> that no receivers cover them.",
  density: "Each cell counts flights (civil, airborne) that crossed it per day, averaged over the selected dates. Dark areas can mean aircraft avoid them <i>or</i> that no receivers cover them.",
  compare: "Red cells lost traffic compared with the baseline, blue cells gained it. A cell that goes from busy to empty is a real change; an area that was always empty may just lack receivers."
};

// ---------- data ----------
async function getJSON(p) { const r = await fetch(p); if (!r.ok) throw new Error(p + " " + r.status); return r.json(); }
async function loadDay(date) {
  if (S.cache.has(date)) return S.cache.get(date);
  const p = getJSON(`data/days/${date}.json`).then(d => {
    const a = new Float32Array(G.w * G.h); let idx = 0; const c = d.cells;
    for (let i = 0; i < c.length; i += 2) { idx += c[i]; a[idx] = c[i + 1]; }
    return a;
  }).catch(() => null);
  S.cache.set(date, p); return p;
}
async function average([i0, i1]) {
  const arrs = await Promise.all(M.days.slice(i0, i1 + 1).map(d => loadDay(d.date)));
  const out = new Float32Array(G.w * G.h); let n = 0;
  for (const a of arrs) { if (!a) continue; n++; for (let i = 0; i < out.length; i++) out[i] += a[i]; }
  if (n) for (let i = 0; i < out.length; i++) out[i] /= n;
  return out;
}
// one line shard: see pipeline/process_day.py for the layout
function parseShard(buf) {
  const u32 = new Uint32Array(buf, 0, 4), nl = u32[1], np = u32[2], al = n => (n + 3) & ~3;
  let o = 16; const lens = new Uint16Array(buf, o, nl); o += al(2 * nl);
  const od = new Uint8Array(buf, o, 2 * nl); o += al(2 * nl);
  const pts = new Int16Array(buf, o, 2 * np); o += al(4 * np);
  const gap = new Uint8Array(buf, o, np);
  return { nl, np, lens, orig: od.subarray(0, nl), dest: od.subarray(nl), pts, gap };
}
let bundle = null; // some hosts can't serve .bin files: manifest.bundle points to one JSON of base64 shards instead
function fetchShard(date, k) {
  if (!M.bundle) return fetch(`data/lines/${date}.s${k}.bin`).then(r => r.ok ? r.arrayBuffer() : null);
  bundle = bundle || getJSON("data/" + M.bundle);
  return bundle.then(b => { const s = b[`${date}.s${k}.bin`]; if (!s) return null;
    const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; });
}
function loadShard(date, k) {
  const key = date + "/" + k;
  if (!S.lineCache.has(key)) S.lineCache.set(key, fetchShard(date, k)
    .then(b => b && b.byteLength >= 16 ? parseShard(b) : null).catch(() => null));
  return S.lineCache.get(key);
}
async function loadLines([i0, i1]) {
  const days = M.days.slice(i0, i1 + 1).filter(d => d.shards);
  const total = days.reduce((s, d) => s + d.legs, 0);
  const per = Math.max(1, Math.min(4, Math.ceil(4 * MAX_LINES / Math.max(1, total))));
  const shards = await Promise.all(days.flatMap(d => Array.from({ length: Math.min(per, d.shards) }, (_, k) => loadShard(d.date, k))));
  let nl = 0, np = 0; for (const s of shards) if (s) { nl += s.nl; np += s.np; }
  const pts = new Int16Array(2 * np), gap = new Uint8Array(np), start = new Uint32Array(nl), len = new Uint16Array(nl),
        orig = new Uint8Array(nl), dest = new Uint8Array(nl);
  let li = 0, pi = 0;
  for (const s of shards) { if (!s) continue;
    pts.set(s.pts, 2 * pi); gap.set(s.gap, pi); orig.set(s.orig, li); dest.set(s.dest, li); len.set(s.lens, li);
    for (let j = 0; j < s.nl; j++) { start[li + j] = pi; pi += s.lens[j]; }
    li += s.nl; }
  return { nl, np, pts, gap, start, len, orig, dest, total, days: days.length, sampled: per < 4 && nl < total };
}

// ---------- colour ----------
const SEQ = [[24,79,149],[42,120,214],[85,152,231],[134,182,239],[205,226,251],[245,249,255]];
function lerpRamp(r, t) { t = Math.max(0, Math.min(1, t)) * (r.length - 1); const i = Math.min(r.length - 2, Math.floor(t)), f = t - i;
  return r[i].map((v, k) => v + (r[i + 1][k] - v) * f); }
const RED = [230,103,103], BLUE = [57,135,229], MID = [56,56,53];
function divColor(t) { const c = t < 0 ? RED : BLUE, f = Math.min(1, Math.abs(t)); return MID.map((v, k) => v + (c[k] - v) * f); }
function quantile(arr, q) { const v = []; for (const x of arr) if (x > 0) v.push(x); if (!v.length) return 1;
  v.sort((a, b) => a - b); return v[Math.min(v.length - 1, Math.floor(q * v.length))]; }

const off = document.createElement("canvas");
async function buildField() {
  off.width = G.w; off.height = G.h;
  const octx = off.getContext("2d"), img = octx.createImageData(G.w, G.h), px = img.data;
  if (S.mode === "density") {
    const f = await average(S.sel); const vmax = Math.max(1, quantile(f, 0.995)); const L = Math.log1p(vmax);
    for (let i = 0; i < f.length; i++) { if (f[i] <= 0) continue; const t = Math.log1p(f[i]) / L;
      const c = lerpRamp(SEQ, t); px.set([c[0], c[1], c[2], Math.round(255 * Math.min(1, 0.25 + t * 0.9))], i * 4); }
    S.field = { a: f }; S.vmax = vmax;
  } else {
    const [a, b] = await Promise.all([average(S.base), average(S.sel)]);
    const ref = Math.max(1, quantile(a.map((x, i) => Math.max(x, b[i])), 0.99)), L = Math.log1p(ref);
    for (let i = 0; i < a.length; i++) { const m = Math.max(a[i], b[i]); if (m < 0.3) continue;
      const t = (b[i] - a[i]) / m, w = Math.min(1, Math.log1p(m) / L), c = divColor(t);
      px.set([c[0], c[1], c[2], Math.round(255 * (0.15 + 0.85 * w) * (0.35 + 0.65 * Math.abs(t)))], i * 4); }
    S.field = { a, b };
  }
  octx.putImageData(img, 0, 0);
}

// ---------- projection ----------
const cv = $("base"), ctx = cv.getContext("2d"), topc = $("top"), tctx = topc.getContext("2d");
const COS = Math.cos(28 * Math.PI / 180);
function base() { const r = cv.getBoundingClientRect(); const wu = (G.lon_max - G.lon_min) * COS, hu = G.lat_max - G.lat_min;
  const s = Math.min(r.width / wu, r.height / hu) * 0.92; return { s, ox: (r.width - wu * s) / 2, oy: (r.height - hu * s) / 2, r }; }
function proj(lat, lon) { const b = base(), s = b.s * S.zoom;
  return [b.ox + S.panX + (lon - G.lon_min) * COS * s, b.oy + S.panY + (G.lat_max - lat) * s]; }
function unproj(x, y) { const b = base(), s = b.s * S.zoom;
  return [G.lat_max - (y - b.oy - S.panY) / s, G.lon_min + (x - b.ox - S.panX) / (COS * s)]; }
function fit(c) { const dpr = devicePixelRatio || 1, r = c.getBoundingClientRect();
  if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  return { dpr, r }; }

// ---------- WebGL lines ----------
const glc = $("gl"), gl = glc.getContext("webgl2", { premultipliedAlpha: true, antialias: true });
// Two passes when the browser has float render targets: (1) count, per screen pixel, the observed
// flights (red channel) and the unobserved straight joins (green) crossing it; (2) draw every flight as
// a solid line whose width grows with flights per day on that pixel. Without float targets the lines are
// blended straight onto the canvas instead (no width encoding).
const R_MAX = 4;   // widest half-width in CSS pixels; the composite pass looks this far around each pixel
let prog, comp, vao, quad, nIdx = 0, acc = null;
if (gl) {
  const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const link = (vs, fs) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; };
  prog = link(`#version 300 es
    in vec2 a_pos; in float a_gap; flat out float v_gap;
    uniform vec4 u_view; uniform vec2 u_res; uniform vec2 u_origin;
    void main() {
      vec2 ll = a_pos / 100.0;            // (lat, lon)
      float x = u_view.x + (ll.y - u_origin.x) * u_view.w * u_view.z;
      float y = u_view.y + (u_origin.y - ll.x) * u_view.z;
      gl_Position = vec4(x / u_res.x * 2.0 - 1.0, 1.0 - y / u_res.y * 2.0, 0.0, 1.0);
      v_gap = a_gap;
    }`, `#version 300 es
    precision mediump float; flat in float v_gap; uniform vec4 u_color; uniform bool u_acc; uniform bool u_gaps; out vec4 o;
    void main() {
      if (v_gap > 1.5) discard;
      bool gap = v_gap > 0.5;
      if (u_acc) { o = gap ? vec4(0.0, 1.0, 0.0, 0.0) : vec4(1.0, 0.0, 0.0, 0.0); return; }
      if (gap && !u_gaps) discard;
      float a = u_color.a * (gap ? 0.3 : 1.0);
      o = vec4(u_color.rgb * a, a);              // fallback: premultiplied additive
    }`);
  comp = link(`#version 300 es
    in vec2 a_xy; void main() { gl_Position = vec4(a_xy, 0.0, 1.0); }`, `#version 300 es
    precision highp float; precision highp int;
    uniform sampler2D u_tex; uniform float u_dpr, u_perDay, u_wk; uniform vec4 u_box; uniform bool u_gaps; out vec4 o;
    const int R = ${R_MAX};
    float halfWidth(float fpd) { return u_wk * (0.45 + 0.3 * log2(1.0 + fpd)); }  // CSS px, fpd = flights/day
    void main() {
      vec2 p = gl_FragCoord.xy / u_dpr;          // position in CSS pixels (= accumulation texels)
      ivec2 sz = textureSize(u_tex, 0), c0 = ivec2(floor(p));
      float cov = 0.0, dens = 0.0;
      for (int j = -R; j <= R; j++) for (int i = -R; i <= R; i++) {
        ivec2 q = c0 + ivec2(i, j);
        if (q.x < 0 || q.y < 0 || q.x >= sz.x || q.y >= sz.y) continue;
        float n = texelFetch(u_tex, q, 0).r;
        if (n <= 0.0) continue;
        float fpd = n * u_perDay, r = min(float(R), halfWidth(fpd));
        float c = clamp(r + 0.5 - length(p - (vec2(q) + 0.5)), 0.0, 1.0);
        if (c > 0.0) { cov = max(cov, c); dens = max(dens, fpd); }
      }
      // colour: every flight visible, busier paths brighter and lighter; dimmer outside the analysis box
      float t = clamp(log2(1.0 + dens) / log2(101.0), 0.0, 1.0);
      vec3 col = mix(vec3(42., 108., 200.) / 255., vec3(196., 222., 252.) / 255., t * t);
      vec2 pt = vec2(p.x, float(sz.y) - p.y);    // y from the top, like u_box
      bool inBox = pt.x >= u_box.x && pt.x <= u_box.z && pt.y >= u_box.y && pt.y <= u_box.w;
      float a = cov * mix(0.5, 1.0, t) * (inBox ? 1.0 : 0.45);
      vec4 line = vec4(col * a, a);
      if (u_gaps && cov < 1.0) {                 // unobserved straight joins: thin, dim, underneath
        float g = texelFetch(u_tex, c0, 0).g;
        if (g > 0.0) { float a = 0.16 * (1.0 - cov); line += vec4(vec3(0.62, 0.62, 0.58) * a, a); }
      }
      if (line.a <= 0.0) discard;
      o = line;
    }`);
  vao = gl.createVertexArray();
  quad = gl.createVertexArray(); gl.bindVertexArray(quad);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const lq = gl.getAttribLocation(comp, "a_xy"); gl.enableVertexAttribArray(lq); gl.vertexAttribPointer(lq, 2, gl.FLOAT, false, 0, 0);
  if (gl.getExtension("EXT_color_buffer_float")) acc = { w: 0, h: 0 };
}
// (re)allocate the per-pixel count buffer, one texel per CSS pixel
function accTargets(w, h) {
  if (acc.w === w && acc.h === h) return true;
  if (acc.fb) gl.deleteFramebuffer(acc.fb); if (acc.tex) gl.deleteTexture(acc.tex);
  acc.tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, acc.tex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, w, h);
  for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.NEAREST);
  acc.fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, acc.fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, acc.tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  acc.w = w; acc.h = h;
  if (!ok) acc = null;   // float targets not usable after all: fall back to direct blending
  return ok;
}
function uploadLines(L) {
  if (!gl) return;
  gl.bindVertexArray(vao);
  const pb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pb); gl.bufferData(gl.ARRAY_BUFFER, L.pts, gl.STATIC_DRAW);
  const lp = gl.getAttribLocation(prog, "a_pos"); gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp, 2, gl.SHORT, false, 0, 0);
